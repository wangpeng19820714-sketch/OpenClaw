services:
  lobster-release-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOBSTER_DB_NAME:-lobster_release}
      POSTGRES_USER: ${LOBSTER_DB_USER:-lobster}
      POSTGRES_PASSWORD: ${LOBSTER_DB_PASSWORD:-lobster}
    ports:
      - "${LOBSTER_DB_PORT:-5432}:5432"
    volumes:
      - lobster-release-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LOBSTER_DB_USER:-lobster} -d ${LOBSTER_DB_NAME:-lobster_release}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  openclaw-gateway:
    depends_on:
      lobster-release-postgres:
        condition: service_healthy
    environment:
      LOBSTER_DB_DRIVER: postgres
      LOBSTER_POSTGRES_CONNECTION_STRING: postgres://${LOBSTER_DB_USER:-lobster}:${LOBSTER_DB_PASSWORD:-lobster}@lobster-release-postgres:5432/${LOBSTER_DB_NAME:-lobster_release}
      LOBSTER_POSTGRES_SCHEMA: ${LOBSTER_DB_SCHEMA:-lobster_release}

volumes:
  lobster-release-postgres-data:
